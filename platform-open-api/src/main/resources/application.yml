server:
  # Default 18081 (avoid 18080 clash)
  port: ${AMP_SERVER_PORT:18081}

spring:
  application:
    name: platform-open-api
  datasource:
    # compose maps container 5432 -> host 15432
    url: ${AMP_PG_URI:jdbc:postgresql://127.0.0.1:15432/amp}
    username: ${AMP_PG_USER:amp}
    password: ${AMP_PG_PASSWORD:amp}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

amp:
  fs:
    # remote = PostgreSQL BaseStore (shared workspace); local = local path
    mode: ${AMP_FS_MODE:remote}
    isolation-scope: ${AMP_FS_SCOPE:USER}
  sandbox:
    enabled: ${AMP_SANDBOX_ENABLED:false}
    image: ${AMP_SANDBOX_IMAGE:alpine:3.19}
    docker-bin: ${DOCKER_BIN:}
    isolation-scope: ${AMP_SANDBOX_SCOPE:USER}
    timeout-sec: ${AMP_SANDBOX_TIMEOUT_SEC:20}
    memory-mb: ${AMP_SANDBOX_MEMORY_MB:256}
    cpus: ${AMP_SANDBOX_CPUS:0.5}
    network-none: ${AMP_SANDBOX_NETWORK_NONE:true}
  loki:
    enabled: ${AMP_LOKI_ENABLED:false}
    url: ${AMP_LOKI_URL:http://127.0.0.1:3100}
    username: ${AMP_LOKI_USERNAME:}
    password: ${AMP_LOKI_PASSWORD:}
    app: ${AMP_LOKI_APP:platform-open-api}
    local-log-file: ${AMP_LOCAL_LOG_FILE:logs/amp-open-api-18081.log}
  otel:
    enabled: ${AMP_OTEL_ENABLED:true}
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    service-name: ${OTEL_SERVICE_NAME:platform-open-api}
  nacos:
    enabled: ${AMP_NACOS_ENABLED:false}
    server-addr: ${AMP_NACOS_SERVER:127.0.0.1:8848}
    namespace: ${AMP_NACOS_NAMESPACE:}
    group: ${AMP_NACOS_GROUP:DEFAULT_GROUP}
    data-id: ${AMP_NACOS_DATA_ID:amp-platform.properties}
    username: ${AMP_NACOS_USERNAME:}
    password: ${AMP_NACOS_PASSWORD:}
    # Nacos AI Registry（决策：仅 nacos→local；discover-only；namespace 后置 prefix）
    ai:
      enabled: ${AMP_NACOS_AI_ENABLED:false}
      server-addr: ${AMP_NACOS_AI_SERVER:${AMP_NACOS_SERVER:127.0.0.1:8848}}
      tenant-namespace: ${AMP_NACOS_AI_TENANT_NS:shared}
      shared-namespace: ${AMP_NACOS_AI_SHARED_NS:public}
      username: ${AMP_NACOS_AI_USERNAME:${AMP_NACOS_USERNAME:}}
      password: ${AMP_NACOS_AI_PASSWORD:${AMP_NACOS_PASSWORD:}}
      context-path: ${AMP_NACOS_AI_CONTEXT_PATH:/nacos}
      sync-direction: nacos-to-local
      agent-card-mode: discover-only
      # Nacos 3 Admin API（与容器 NACOS_AUTH_IDENTITY_* 对齐）
      identity-key: ${AMP_NACOS_AI_IDENTITY_KEY:serverIdentity}
      identity-value: ${AMP_NACOS_AI_IDENTITY_VALUE:security}
      sync-on-start: ${AMP_NACOS_AI_SYNC_ON_START:false}
      prompt-enabled: ${AMP_NACOS_AI_PROMPT_ENABLED:false}
      prompt-pin-published: ${AMP_NACOS_AI_PROMPT_PIN:true}
      prompt-stable-label: ${AMP_NACOS_AI_PROMPT_STABLE_LABEL:stable}
      prompt-latest-label: ${AMP_NACOS_AI_PROMPT_LATEST_LABEL:latest}
      prompt-key-prefix: ${AMP_NACOS_AI_PROMPT_KEY_PREFIX:amp.agent.}
      prompt-cache-ttl-ms: ${AMP_NACOS_AI_PROMPT_CACHE_TTL_MS:60000}
      # tenant-namespace=prefix 时：namespace = {namespace-prefix}{tenantId}
      namespace-prefix: ${AMP_NACOS_AI_NS_PREFIX:amp-}
  external:
    heartbeat-timeout-sec: ${AMP_EXTERNAL_HB_TIMEOUT_SEC:90}
  ops:
    rate-limit-enabled: ${AMP_RATE_LIMIT_ENABLED:true}
    rate-limit-per-minute: ${AMP_RATE_LIMIT_PER_MINUTE:120}
    token-chars-per-token: ${AMP_TOKEN_CHARS_PER_TOKEN:3}
    token-cost-per-1k: ${AMP_TOKEN_COST_PER_1K:2}
  auth:
    enabled: ${AMP_AUTH_ENABLED:true}
    keys:
      # Open API key (chat etc.); cannot call /api/v1/admin/**
      # 授权 = 租户 + scope；agents 可选收窄（空/* = 租户内全部 Agent）
      - key: ${AMP_API_KEY:s0-demo-key}
        tenant-id: ${AMP_TENANT_ID:acme}
        agents: ['*']
        scopes: [open]
      # Admin / ops key; rotate in production
      - key: ${AMP_ADMIN_API_KEY:s0-admin-key}
        tenant-id: ${AMP_TENANT_ID:acme}
        agents: ['*']
        scopes: [open, admin]
  pc-platform:
    base-url: ${AMP_PC_PLATFORM_BASE_URL:}
  agent:
    name: demo
    model-id: ${AMP_MODEL_ID:deepseek:deepseek-flash}
    sysPrompt: "你是一个简洁的 AI 中台演示助手，用中文回答。"
    workspace: ${AMP_WORKSPACE:.agentscope/workspace}
    redis-uri: ${AMP_REDIS_URI:redis://127.0.0.1:6379}
    state-key-prefix: "amp:demo:session:"
    require-session-context: true
    # 0 = dynamic trigger by model window
    compaction-trigger-tokens: ${AMP_COMPACTION_TRIGGER_TOKENS:0}
    # Fallback model when primary fails; blank disables
    fallback-model-id: ${AMP_FALLBACK_MODEL_ID:}
    max-retries: ${AMP_MODEL_MAX_RETRIES:3}
    max-context-tokens: ${AMP_MAX_CONTEXT_TOKENS:8000}
    enable-plan-mode: ${AMP_ENABLE_PLAN_MODE:false}
    enable-task-list: ${AMP_ENABLE_TASK_LIST:false}
    enable-meta-tool: ${AMP_ENABLE_META_TOOL:false}
    # Async tool offload; 0 disables
    async-tool-timeout-ms: ${AMP_ASYNC_TOOL_TIMEOUT_MS:0}
    # Explicit compaction (Java quickstart style)
    compaction-trigger-messages: ${AMP_COMPACTION_TRIGGER_MESSAGES:30}
    compaction-keep-messages: ${AMP_COMPACTION_KEEP_MESSAGES:10}
    tool-result-eviction: ${AMP_TOOL_RESULT_EVICTION:true}
  # Tool surface: deny = blacklist; allow = whitelist
  tools:
    mode: ${AMP_TOOLS_MODE:deny}
    # allow: [knowledge_search, safe_lookup]
    extra-deny: []
    enable-agent-spawn: ${AMP_TOOLS_AGENT_SPAWN:false}
    enable-shell: ${AMP_TOOLS_SHELL:false}
    enable-filesystem: ${AMP_TOOLS_FS:false}
  # RAG embedding: hash=local(演示); http=OpenAI-compatible /v1/embeddings
  # 默认走本地 qwen3-embedding-4b 服务（scripts/embed-server.py，:18090）；失败自动回退 hash
  rag:
    provider: ${AMP_RAG_PROVIDER:http}
    http-base-url: ${AMP_RAG_BASE_URL:http://127.0.0.1:18090/v1}
    http-api-key: ${AMP_RAG_API_KEY:}
    http-model: ${AMP_RAG_MODEL:qwen3-embedding-4b}
    http-dimensions: ${AMP_RAG_DIMS:}
    # Dify knowledge (Dataset API): enabled=true routes ingest/search to Dify
    dify:
      enabled: ${AMP_DIFY_KB_ENABLED:true}
      base-url: ${AMP_DIFY_KB_BASE_URL:http://192.168.31.201/v1}
      api-key: ${AMP_DIFY_KB_API_KEY:}
      dataset-id: ${AMP_DIFY_KB_DATASET_ID:}
      dataset-name: ${AMP_DIFY_KB_DATASET_NAME:amp-knowledge}
      search-method: ${AMP_DIFY_KB_SEARCH:hybrid_search}
      reranking-enable: ${AMP_DIFY_KB_RERANK:false}
      score-threshold-enabled: ${AMP_DIFY_KB_SCORE_ON:false}
      score-threshold: ${AMP_DIFY_KB_SCORE:0.5}

  # Mem0 长期记忆（官方 agentscope-extensions-mem0）
  # 自托管: docker compose -f docker-compose.mem0.yml --env-file scripts/mem0/.env up -d
  mem0:
    enabled: ${AMP_MEM0_ENABLED:false}
    base-url: ${AMP_MEM0_BASE_URL:http://127.0.0.1:8888}
    api-key: ${AMP_MEM0_API_KEY:}
    api-type: ${AMP_MEM0_API_TYPE:self-hosted}
    auto-recall: ${AMP_MEM0_AUTO_RECALL:true}
    auto-capture: ${AMP_MEM0_AUTO_CAPTURE:true}
    recall-top-k: ${AMP_MEM0_RECALL_TOP_K:5}
    timeout-sec: ${AMP_MEM0_TIMEOUT_SEC:60}
  skill:
    canary:
      environment: ${AMP_SKILL_ENV:}
      default-percent: ${AMP_SKILL_ROLLOUT:100}
      allowed-environments: ${AMP_SKILL_ENVS:}
  runtime:
    max-instances: ${AMP_RUNTIME_MAX_INSTANCES:50}
    drain-timeout-ms: ${AMP_RUNTIME_DRAIN_TIMEOUT_MS:120000}
    drain-sweep-ms: ${AMP_RUNTIME_DRAIN_SWEEP_MS:5000}
  sse:
    replay-ttl-ms: ${AMP_SSE_REPLAY_TTL_MS:30000}
  events:
    enabled: ${AMP_EVENTS_ENABLED:true}

logging:
  level:
    com.sinosoft.amp: INFO
    io.agentscope: INFO
